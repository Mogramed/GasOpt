name: gasops
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./outputs/empirical:/app/outputs/empirical:ro
    restart: unless-stopped
    init: true
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
